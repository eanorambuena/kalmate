name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        run: sudo apt-get update -q && sudo apt-get install -yq chromium-browser

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run Lighthouse
        run: |
          mkdir -p reports
          npx lighthouse https://kalmate.pages.dev \
            --output=html \
            --output=json \
            --output-path=./reports/lighthouse \
            --chrome-flags="--headless --no-sandbox --disable-gpu"
          npx lighthouse https://kalmate.pages.dev/terminal \
            --output=html \
            --output-path=./reports/lighthouse-terminal \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
