name: Lighthouse

# Audits the live site, so it runs after a successful deploy instead of racing it.
on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run Lighthouse
        run: |
          CHROME_PATH=$(which google-chrome 2>/dev/null || which chromium-browser 2>/dev/null || which chromium 2>/dev/null || echo "")
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome found on the runner"
            exit 1
          fi
          echo "Using Chrome: $CHROME_PATH"
          mkdir -p reports
          FLAGS="--headless=new --no-sandbox --disable-gpu"
          # Headless Chrome on shared runners sometimes reports NO_FCP on a page
          # that renders fine; retry before calling the audit failed.
          audit() {
            local url="$1"; shift
            for attempt in 1 2 3; do
              if pnpm exec lighthouse "$url" "$@" \
                --config-path=.github/lighthouse-config.json \
                --chrome-path="$CHROME_PATH" --chrome-flags="$FLAGS"; then
                return 0
              fi
              echo "::warning::Lighthouse attempt $attempt failed for $url"
              sleep 10
            done
            return 1
          }
          audit https://kalmate.pages.dev \
            --output=html --output=json --output-path=./reports/lighthouse
          audit https://kalmate.pages.dev/terminal \
            --output=html --output-path=./reports/lighthouse-terminal

      - name: Summary
        if: always()
        run: |
          [ -f reports/lighthouse.report.json ] || exit 0
          node -e '
            const r = require("./reports/lighthouse.report.json");
            const rows = Object.values(r.categories).map(c => `| ${c.title} | ${Math.round(c.score * 100)} |`);
            console.log(["| Category | Score |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
