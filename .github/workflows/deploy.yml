name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild 2>/dev/null || true
      - run: pnpm build
      - name: Create Cloudflare Pages project
        run: npx wrangler pages project create kalmate --production-branch main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Setup KV namespace
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          # Try to create KV namespace
          CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"kalmate-kv"}')
          KV_ID=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('id',''))" 2>/dev/null)
          if [ -z "$KV_ID" ]; then
            # Already exists, list to find
            LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $API_TOKEN")
            KV_ID=$(echo "$LIST" | python3 -c "
import sys,json
data = json.load(sys.stdin)
for ns in data.get('result',[]):
    if ns['title'] == 'kalmate-kv':
        print(ns['id'])
" 2>/dev/null)
          fi
          echo "KV_ID=$KV_ID"
          if [ -n "$KV_ID" ]; then
            cat > wrangler.toml <<EOF
name = "kalmate"
compatibility_date = "2024-11-01"
pages_build_output_dir = ".output/public"

[[kv_namespaces]]
binding = "KALMATE_KV"
id = "$KV_ID"
EOF
            echo "wrangler.toml updated with KV namespace $KV_ID"
          else
            echo "Warning: Could not create/find KV namespace"
          fi
      - name: Deploy to Cloudflare
        run: npx wrangler pages deploy dist --project-name=kalmate --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
