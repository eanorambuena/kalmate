name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild 2>/dev/null || true
      - run: pnpm build
      - name: Create Cloudflare Pages project
        run: npx wrangler pages project create kalmate --production-branch main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Setup KV namespace
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CREATE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"kalmate-kv"}')
          KV_ID=$(echo "$CREATE" | jq -r '.result.id // empty')
          if [ -z "$KV_ID" ]; then
            LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $API_TOKEN")
            KV_ID=$(echo "$LIST" | jq -r '.result[] | select(.title=="kalmate-kv") | .id')
          fi
          [ -n "$KV_ID" ] && printf 'name = "kalmate"\ncompatibility_date = "2024-11-01"\npages_build_output_dir = ".output/public"\n\n[[kv_namespaces]]\nbinding = "KALMATE_KV"\nid = "%s"\n' "$KV_ID" > wrangler.toml || echo "Warning: no KV namespace"
      - name: Deploy to Cloudflare
        run: npx wrangler pages deploy dist --project-name=kalmate --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
