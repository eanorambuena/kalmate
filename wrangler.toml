name = "kalmate"
compatibility_date = "2024-11-01"

pages_build_output_dir = ".output/public"

[vars]
# GROQ_API_KEY set in Cloudflare Dashboard (Settings > Environment Variables)

# Ticker cache (D1). To enable: run `npx wrangler d1 create kalmate-tickers`,
# paste the database_id below, then `npx wrangler d1 migrations apply kalmate-tickers --remote`.
# [[d1_databases]]
# binding = "TICKERS_DB"
# database_name = "kalmate-tickers"
# database_id = "PASTE_ID_HERE"
